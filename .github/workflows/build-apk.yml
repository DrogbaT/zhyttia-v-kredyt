name: Зібрати APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          echo "window.BUILD_INFO={build:${{ github.run_number }}};" > app/src/main/assets/build-info.js
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Zhyttia-v-kredyt-beta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zhyttia-v-kredyt-apk
          path: Zhyttia-v-kredyt-beta.apk

      - name: Опублікувати APK для скачування з телефону
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Життя в кредит — бета, збірка ${{ github.run_number }}
          files: Zhyttia-v-kredyt-beta.apk
          make_latest: true
          prerelease: true

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Windows exe
        shell: bash
        run: |
          mkdir -p desktop/game
          echo "window.BUILD_INFO={build:${{ github.run_number }}};" > app/src/main/assets/build-info.js
          cp app/src/main/assets/* desktop/game/
          cp play-store/icon-512.png desktop/icon.png
          cd desktop
          npm pkg set version=3.3.${{ github.run_number }}
          npm install --no-audit --no-fund
          npx electron-builder --win nsis portable --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Zhyttia-v-kredyt-windows
          path: desktop/dist/*.exe

      - name: Додати exe до релізу
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: desktop/dist/*.exe
          prerelease: true
