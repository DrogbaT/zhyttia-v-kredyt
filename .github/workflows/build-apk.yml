name: Зібрати APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Zhyttia-v-kredyt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zhyttia-v-kredyt-apk
          path: Zhyttia-v-kredyt.apk

      - name: Опублікувати APK для скачування з телефону
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Життя в кредит — збірка ${{ github.run_number }}
          files: Zhyttia-v-kredyt.apk
          make_latest: true
