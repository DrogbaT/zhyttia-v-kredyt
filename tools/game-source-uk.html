<title>Життя в кредит</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column — board as a 7×7 ring with the dice table in its hollow centre, players and log below */
:root{
  --table:#141a2e;      /* felt of the table */
  --table-2:#1d2540;
  --paper:#e4e9f2;      /* board cells */
  --ink:#151a2b;
  --text:#eef1f8;
  --muted:#9aa3bd;
  --gold:#f2c14e;       /* money accent */
  --home:#e8705a; --car:#3fb6b0; --biz:#e3a43a;
  --health:#f3c6cf; --fate:#cfc4f3; --corner:#c9d3e6;
  --hp:#ef6f8a; --joy:#6fb5ef; --ok:#7fd49a;
  --line:rgba(255,255,255,.09);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--table)}
body{color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;
  background:radial-gradient(120% 70% at 50% 0%,var(--table-2),var(--table) 70%);min-height:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- setup ---------- */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.hero h1{font-size:clamp(28px,8vw,40px);font-weight:800;line-height:1.02}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.panel{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.hint{margin:0;color:var(--muted);font-size:13px}
.prow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center}
.prow.off{opacity:.45}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.08);flex:none}
input[type=text]{width:100%;min-width:0;background:var(--table);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 11px;font:inherit}
.codein{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.2em;text-align:center}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 10px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--gold);color:var(--ink);font-weight:700}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;background:rgba(255,255,255,.08)}
.btn.pri{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:grid;gap:4px}
.rules b{color:var(--text);font-weight:600}

/* ---------- lobby ---------- */
.code{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,11vw,52px);letter-spacing:.14em;color:var(--gold);text-align:center;line-height:1.1;user-select:all;-webkit-user-select:all}
.seats{display:flex;flex-direction:column}
.seat{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.seat:last-child{border-bottom:0}
.seat .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .tag{font-size:12px;color:var(--muted)}
.seat .x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.seat.empty .nm{color:var(--muted);font-weight:400}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}

/* ---------- board ---------- */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.top h2{font-size:17px}
.top .round{color:var(--muted);font-size:13px;text-align:right}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px;align-self:center}
.board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:2px;width:100%;aspect-ratio:1;max-width:100%}
.cell{position:relative;background:var(--paper);color:var(--ink);border-radius:6px;overflow:hidden;border:0;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:0}
.cell .stripe{position:absolute;top:0;left:0;right:0;height:18%;background:var(--g,transparent)}
.cell .ic{font-size:clamp(12px,3.7vw,21px);line-height:1;margin-top:10%}
.cell .pr{font-size:clamp(7px,2vw,10px);font-weight:700;font-variant-numeric:tabular-nums;opacity:.75;line-height:1.2}
.cell.t-health{background:var(--health)}
.cell.t-fate{background:var(--fate)}
.cell.corner{background:var(--corner)}
.cell.owned{box-shadow:inset 0 0 0 3px var(--own)}
.cell.owned .pr{opacity:1}
.cell.here{outline:2px solid var(--gold);outline-offset:1px}
.toks{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.tok{width:clamp(8px,2.4vw,12px);height:clamp(8px,2.4vw,12px);border-radius:50%;background:var(--c);border:1.5px solid var(--ink)}
.g-home{--g:var(--home)} .g-car{--g:var(--car)} .g-biz{--g:var(--biz)}

.centre{grid-row:2/9;grid-column:2/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2vw,12px);padding:6px;text-align:center}
.turn-name{font-family:var(--f-display);font-weight:700;font-size:clamp(14px,4.4vw,20px);display:flex;align-items:center;gap:8px;max-width:100%}
.turn-sub{color:var(--muted);font-size:clamp(11px,3vw,13px);margin-top:-4px}
.turn-sub.me{color:var(--ok);font-weight:600}
.dice{display:flex;gap:10px}
.die{width:clamp(38px,11vw,54px);aspect-ratio:1;background:var(--paper);border-radius:10px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:16%;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.die i{width:72%;aspect-ratio:1;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.v{visibility:visible}
.die.roll{animation:shake .35s ease-in-out infinite}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.roll-btn{font-family:var(--f-display);font-size:clamp(13px,3.6vw,16px);padding:11px 18px}

/* ---------- players ---------- */
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard.cur{border-color:var(--gold);background:rgba(242,193,78,.08)}
.pcard.out{opacity:.4}
.pname{display:flex;align-items:center;gap:6px;font-weight:700;min-width:0}
.pname span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pjob{font-size:12px;color:var(--muted);margin-top:-4px}
.money{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums}
.money.neg{color:var(--hp)}
.bar{display:grid;grid-template-columns:14px 1fr 28px;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.bar .tr{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar .fl{display:block;height:100%;border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--text)}
.chip.bad{background:rgba(239,111,138,.2)}
.chip.good{background:rgba(111,181,239,.2)}
.chip.you{background:rgba(127,212,154,.22)}

.log{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);max-height:220px;overflow:auto}
.log div{padding:5px 0;border-bottom:1px solid var(--line)}
.log div:first-child{color:var(--text)}
.log b{color:var(--text);font-weight:600}

.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(5,8,18,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:480px;background:var(--table-2);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:82vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{font-size:18px}
.sheet .who{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sheet .body{color:var(--text)}
.sheet .body p{margin:0 0 6px}
.sheet .pick{color:var(--gold)}
.fulllog{display:flex;flex-direction:column;font-size:13px}
.lround{position:sticky;top:-18px;background:var(--table-2);padding:8px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:700}
.lline{padding:4px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.lline b{color:var(--text)}
.dream:disabled{opacity:.5}
.sheet .who:empty{display:none}
.coins{flex:none;font-weight:700;font-size:13px;color:var(--gold);margin-right:4px}
.perks{display:flex;flex-direction:column;gap:6px}
.perk{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);opacity:.55}
.perk.on{opacity:1}
.perk .pi{font-size:20px;line-height:1.2}
.perk b{display:block;font-size:14px}
.perk b small{color:var(--muted);font-weight:500}
.perk>span>small{color:var(--muted);font-size:13px}
.figgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fig{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);text-align:center;min-width:0}
.fig.on{border:2px solid var(--gold);background:rgba(242,193,78,.12)}
.fig b{font-size:12px;line-height:1.2}
.fig .fprice{font-size:12px;color:var(--gold);font-weight:700}
.fig.locked .fthumb{filter:grayscale(.7) brightness(.7)}
.fthumb{width:100%;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:36px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.12),transparent 70%)}
.fthumb img{width:100%;height:100%;object-fit:contain}
.b3slot{width:100%;aspect-ratio:1/.95;border-radius:18px;overflow:hidden;background:#141a2e;box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 0 0 1px var(--line)}
.b3{width:100%;height:100%;touch-action:manipulation}
.b3 canvas{display:block;width:100%!important;height:100%!important}
.dock{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
.dock .turn-name{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .turn-sub{grid-column:1;grid-row:2;margin:0}
.dock .dice{grid-column:2;grid-row:1/3;gap:6px}
.dock .die{width:38px}
.dock .roll-btn,.dock #again{grid-column:3;grid-row:1/3}
.dock #seeLog{grid-column:1/-1}
@media (orientation:landscape) and (min-width:620px){.b3slot{aspect-ratio:1/.9}}
.beta{display:inline-block;vertical-align:top;margin-top:6px;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--car);border-radius:6px;padding:3px 7px;-webkit-text-fill-color:var(--ink)}
.crrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.crrow.col{flex-direction:column;align-items:stretch;gap:6px}
.crrow b{font-size:14px;font-weight:600}
.crrow span>small{display:block;color:var(--muted);font-size:12px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-size:18px;font-weight:700}
.stepper .sv{min-width:84px;text-align:center;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lang{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:10px;padding:9px 4px;font-size:13px;font-weight:600}
.lang.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.qcount{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink);background:var(--gold);border-radius:999px;padding:2px 8px}
.sheet .acts{display:flex;flex-direction:column;gap:8px}
.card{border-radius:14px;padding:16px;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.card.health{background:var(--health)} .card.fate{background:var(--fate)}
.card .kind{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.6}
.card .ttl{font-family:var(--f-display);font-weight:700;font-size:19px}

.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.asset-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.asset-row small{display:block;color:var(--muted)}
.asset-row .btn{padding:8px 12px;font-size:13px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--gold);color:var(--ink);font-weight:700;padding:9px 16px;border-radius:999px;z-index:30;font-size:14px;max-width:90vw;text-align:center;animation:up .2s;box-shadow:0 6px 20px rgba(0,0,0,.35)}
/* ---------- v2: menu, rules, hints, profile, landscape ---------- */
body{background:
  radial-gradient(90% 55% at 15% -5%,rgba(242,193,78,.13),transparent 60%),
  radial-gradient(80% 50% at 110% 10%,rgba(94,200,216,.12),transparent 60%),
  radial-gradient(circle at 1px 1px,rgba(255,255,255,.045) 1px,transparent 0) 0 0/18px 18px,
  var(--table)}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:600;padding:6px 0;align-self:flex-start}
.screen-title{font-size:clamp(22px,6vw,30px);font-weight:800}

.menu-hero{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:4px 0}
.menu-hero h1{font-size:clamp(34px,10vw,54px);font-weight:800;line-height:.95}
.menu-hero h1 em{font-style:normal;display:block;background:linear-gradient(90deg,var(--gold),#ffd98a 50%,var(--home));-webkit-background-clip:text;background-clip:text;color:transparent}
.menu-hero p{grid-column:1/-1;margin:0;color:var(--muted);max-width:46ch}
.hero-dice{position:relative;width:clamp(78px,22vw,110px);aspect-ratio:1}
.hero-dice .die{position:absolute;width:58%;box-shadow:0 8px 18px rgba(0,0,0,.45),0 3px 0 rgba(0,0,0,.35)}
.hero-dice .die:first-child{left:0;top:0;transform:rotate(-14deg);animation:float1 4s ease-in-out infinite}
.hero-dice .die:last-child{right:0;bottom:0;background:var(--gold);transform:rotate(12deg);animation:float2 4.6s ease-in-out infinite}
@keyframes float1{50%{transform:rotate(-4deg) translateY(-6px)}}
@keyframes float2{50%{transform:rotate(22deg) translateY(4px)}}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;padding:14px;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));transition:transform .15s,border-color .15s}
.tile:active{transform:scale(.97)}
.tile:hover{border-color:rgba(255,255,255,.22)}
.tile .gl{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--tc,rgba(255,255,255,.1))}
.tile b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.15}
.tile span{font-size:12px;color:var(--muted)}
.tile.wide{grid-column:1/-1;min-height:84px;padding-left:66px;justify-content:center}
.tile.wide .gl{top:50%;transform:translateY(-50%)}
.tile.hot{background:linear-gradient(135deg,var(--gold),#f6d27a);color:var(--ink);border:0}
.tile.hot span{color:rgba(21,26,43,.7)}
.tile.hot .gl{background:rgba(21,26,43,.12)}

.hintbar{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:rgba(242,193,78,.09);border:1px dashed rgba(242,193,78,.35);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--text)}
.hintbar .bulb{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px;font-family:var(--f-display)}
.hintbar small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.tip{margin:0;font-size:13px;color:var(--muted);border-left:2px solid var(--gold);padding-left:10px}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch .t{display:flex;flex-direction:column}
.switch .t small{color:var(--muted);font-size:12px}
.toggle{width:50px;height:30px;border-radius:999px;border:0;background:rgba(255,255,255,.15);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:transform .2s}
.toggle[aria-checked=true]{background:var(--gold)}
.toggle[aria-checked=true]::after{transform:translateX(20px);background:var(--ink)}

.rules-sec{display:flex;flex-direction:column;gap:8px}
.rules-sec h3{font-size:16px;display:flex;align-items:center;gap:8px}
.rules-sec p{margin:0;color:var(--muted);font-size:14px;max-width:65ch}
.rules-sec p b{color:var(--text)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td:first-child{white-space:normal}
.swatch{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}
.celllist{display:grid;grid-template-columns:1fr;gap:6px}
.celllist div{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;font-size:14px}
.celllist div>span:first-child{font-size:20px;line-height:1.2}
.celllist b{display:block}
.celllist small{color:var(--muted);font-size:13px}
.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{border-radius:12px;padding:10px;color:var(--ink);font-size:12px}
.mini b{display:block;font-family:var(--f-display);font-size:13px;margin-bottom:2px}
.mini.bad{background:var(--health)} .mini.good{background:#cfe6f7} .mini.fate{background:var(--fate)}

/* profile */

function contextHint(p){
  if(!isMine(p))return null;
  if(p.hp<35)return 'Здоров’я низьке: лікарня (+40) або спортзал (+15). Нижче 30 — зарплата менша.';
  if(p.happy<20)return 'Щастя майже на нулі. Вечірка, поїздка чи власне майно піднімуть настрій.';
  if(p.money<1500&&payments(p)>0)return 'Мало грошей: на «Зарплаті» знімуть платежі '+fmt(payments(p))+'. Якщо піде в мінус — банк продасть майно.';
  if(payments(p)>p.job.s)return 'Платежі ('+fmt(payments(p))+') вищі за зарплату ('+fmt(p.job.s)+'). Обережно з новими кредитами.';
  if(G.round===1&&p.owned.length===0)return 'Стань на кольорову клітинку — зможеш взяти майно в кредит за 20% внеску.';
  return null;
}

const TITLES=['Студент','Стажер','Найманий працівник','Позичальник','Іпотечник','Підприємець','Інвестор','Рантьє','Мільйонер','Фінансово вільний'];

const lvlNeed=L=>60*L*(L-1);              // total XP to reach level L
function levelOf(xp){let L=1;while(L<TITLES.length&&xp>=lvlNeed(L+1))L++;return L}
let PROF=null;
try{PROF=JSON.parse(localStorage.getItem(PROFKEY)||'null')}catch(e){}

function xpProgress(){const L=profLevel();if(L>=TITLES.length)return {L,pct:100,left:0};const a=lvlNeed(L),b=lvlNeed(L+1);return {L,pct:Math.round((PROF.xp-a)/(b-a)*100),left:b-PROF.xp}}

function myPlayer(){
  if(!G||!PROF)return null;

  return G.players.find(p=>p.ctrl==='local'&&!p.bot&&p.name===PROF.name)||G.players.find(p=>!p.bot)||null;

function awardXP(){
  const me=myPlayer();
  if(!me||!G.over||!G.id||PROF.lastGame===G.id)return null;
  const rank=[...G.players].sort((a,b)=>(a.out-b.out)||score(b)-score(a));
  const place=rank.indexOf(me)+1, won=G.winner===G.players.indexOf(me);
  if(RU().out==='restart'&&!RU().rounds&&!RU().goal)return null;
  const before=profLevel();
  let xp=(G.mode==='elim'?55:40)+(won?120:place===2?60:20)+Math.min(60,Math.max(0,Math.floor(worth(me)/1000)))+(G.online?20:0);
  const half=G.mode==='creative'?.5:1;xp=Math.round(xp*half);const coins=Math.round((PLACE_COINS[place-1]||0)*half);PROF.coins=(PROF.coins||0)+coins;
  PROF.xp+=xp;PROF.games++;if(won)PROF.wins++;PROF.best=Math.max(PROF.best,Math.round(worth(me)));PROF.lastGame=G.id;
  if(G.online)PROF.online++;
  saveProf();
  const after=profLevel();
  return {xp,coins,won,place,levelUp:after>before?after:0};
}

const PREFIX='zhyttia-v-kredyt-', ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:5},()=>ALPH[Math.floor(Math.random()*ALPH.length)]).join('');
const send=(conn,m)=>{try{if(conn&&conn.open)conn.send(m)}catch(e){}};
function netSend(m,except){if(!isHost())return;NET.conns.forEach((c,id)=>{if(id!==except)send(c,m)})}
function netShow(view,except){netSend({t:'show',opts:view},except)}
function say(text){toast(text);netSend({t:'toast',text})}
function leaveNet(){if(NET){try{NET.peer.destroy()}catch(e){}}NET=null;pending.forEach(x=>x.res(x.botChoice));pending.clear()}
function backToMenu(){leaveNet();G=null;busy=false;clearSheets();renderSetup()}
function netFail(msg){leaveNet();G=null;clearSheets();renderSetup();sheet({title:'Не вдалося підключитись',body:`<p>${esc(msg)}</p>`})}

function hostRoom(name){
  leaveNet();
  const code=genCode();
  let peer;try{peer=new Peer(PREFIX+code,{debug:0})}catch(e){return netFail('Немає з’єднання з сервером гри.')}
  NET={role:'host',peer,code,myId:'host',conns:new Map(),seats:[{name,ctrl:'host',bot:false,av:PROF.av,dream:PROF.dream,fig:PROF.fig,lvl:profLevel()}],started:false,ready:false};
  renderLobby();
  peer.on('open',()=>{if(NET&&NET.peer===peer){NET.ready=true;renderLobby()}});
  peer.on('error',e=>{
    if(!NET||NET.peer!==peer)return;
    if(e.type==='unavailable-id'){try{peer.destroy()}catch(_){}NET=null;return hostRoom(name)}
    if(e.type==='peer-unavailable')return;
    if(!NET.started)netFail('Сервер гри недоступний. Перевір інтернет і спробуй ще раз.');
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('connection',conn=>{
    conn.on('data',m=>onHostData(conn,m));
    conn.on('close',()=>onHostClose(conn));
    conn.on('error',()=>onHostClose(conn));
  });
}
function lobbyMsg(){return {t:'lobby',code:NET.code,mode:NET.mode||'classic',rules:rulesFor(NET.mode||'classic'),seats:NET.seats.map(s=>({name:s.name,bot:s.bot,ctrl:s.ctrl,av:s.av||null,fig:s.fig||null,lvl:s.lvl||1}))}}
function onHostData(conn,m){
  if(!NET||!m||typeof m!=='object')return;
  const id=conn.peer;
  if(m.t==='join'){
    if(NET.started||NET.seats.length>=4){send(conn,{t:'full'});setTimeout(()=>{try{conn.close()}catch(e){}},500);return}
    const name=String(m.name||'Гравець').trim().slice(0,14)||'Гравець';
    const av=AVATARS.some(a=>a[0]===m.av)?m.av:null, dream=DREAMS[m.dream]?m.dream:null, fig=FIGS.some(f=>f.id===m.fig)?m.fig:null, lvl=Math.max(1,Math.min(10,m.lvl|0||1));
    NET.conns.set(id,conn);NET.seats.push({name,ctrl:id,bot:false,av,dream,fig,lvl});
    netSend(lobbyMsg());renderLobby();toast(`${name} у кімнаті`);return;
  }
  if(!NET.started||!G)return;
  if(m.t==='roll'){const p=P();if(!busy&&!G.over&&!p.bot&&p.ctrl===id)doTurn();return}
  if(m.t==='answer'){const x=pending.get(m.id);if(x&&x.ctrl===id){pending.delete(m.id);x.res(x.allowed.includes(m.v)?m.v:x.botChoice)}return}
  if(m.t==='hide'){const p=P();if(!busy&&!G.over&&p.ctrl===id&&!p.bot&&hideAsset(p,m.k))renderGame();return}
  if(m.t==='sell'){const p=P();if(!busy&&!G.over&&p.ctrl===id&&!p.bot&&p.owned[m.k]&&p.owned[m.k].cell>=0){sellAsset(p,m.k);renderGame()}return}
}
function onHostClose(conn){
  if(!NET||!isHost())return;
  const id=conn.peer;if(!NET.conns.has(id))return;
  NET.conns.delete(id);
  if(!NET.started){const s=NET.seats.find(x=>x.ctrl===id);NET.seats=NET.seats.filter(x=>x.ctrl!==id);netSend(lobbyMsg());renderLobby();if(s)toast(`${s.name} вийшов`);return}
  if(!G)return;
  G.players.forEach(p=>{if(p.ctrl===id&&!p.out){p.bot=true;log(`${nm(p)} відключився — за нього грає бот.`)}});
  pending.forEach((x,k)=>{if(x.ctrl===id){pending.delete(k);x.res(x.botChoice)}});
  renderGame();
  if(!busy&&!G.over&&P().ctrl===id)startTurn();
}
function hostAddBot(){
  const used=NET.seats.map(s=>s.name);
  const name=BOT_NAMES.find(n=>!used.includes(n))||'Бот';
  NET.seats.push({name,ctrl:'bot-'+Math.random().toString(36).slice(2,7),bot:true,fig:rnd(FREE_FIGS)});
  netSend(lobbyMsg());renderLobby();
}
function hostStart(){
  NET.started=true;
  freshGame(NET.seats,true,NET.mode||'classic');
  renderGame();startTurn();
}

function joinRoom(name,code){
  leaveNet();
  let peer;try{peer=new Peer({debug:0})}catch(e){return netFail('Немає з’єднання з сервером гри.')}
  NET={role:'client',peer,code,myId:null,seats:[],hostConn:null,joined:false};
  renderLobby();
  const timer=setTimeout(()=>{if(NET&&NET.peer===peer&&!NET.joined)netFail('Кімната не відповідає. Перевір код і інтернет.')},15000);
  peer.on('open',id=>{
    if(!NET||NET.peer!==peer)return;
    NET.myId=id;
    const conn=peer.connect(PREFIX+code,{reliable:true,serialization:'json'});
    NET.hostConn=conn;
    conn.on('open',()=>send(conn,{t:'join',name,av:PROF.av,dream:PROF.dream,fig:PROF.fig,lvl:profLevel()}));
    conn.on('data',m=>{if(NET&&NET.peer===peer)onClientData(m,timer)});
    conn.on('close',()=>{if(NET&&NET.peer===peer)hostGone()});
  });
  peer.on('error',e=>{
    if(!NET||NET.peer!==peer)return;
    clearTimeout(timer);
    if(e.type==='peer-unavailable')netFail('Кімнату з кодом '+code+' не знайдено. Перевір код.');
    else if(!G)netFail('Сервер гри недоступний. Перевір інтернет і спробуй ще раз.');
  });
}
function onClientData(m,timer){
  if(!m||typeof m!=='object')return;
  if(m.t==='lobby'){NET.joined=true;clearTimeout(timer);NET.seats=m.seats;NET.mode=m.mode;NET.rules=m.rules;if(!G)renderLobby();return}
  if(m.t==='full'){clearTimeout(timer);return netFail('Кімната заповнена або гра вже почалась.')}
  if(m.t==='state'){NET.joined=true;G=m.G;{NET.hist=NET.hist||[];const last=NET.lastN||0;const fresh=(G.log||[]).filter(e=>e&&e.n>last).sort((a,b)=>a.n-b.n);fresh.forEach(e=>NET.hist.push(e));if(fresh.length)NET.lastN=fresh[fresh.length-1].n;G.hist=NET.hist}lastDice=m.dice;rolling=m.rolling;busy=m.busy;renderGame();if(G.over){archiveGame();const r=awardXP();if(r)note({title:r.place===1?'🏆 Перемога!':`${r.place}-е місце`,body:xpLine(r)})}return}
  if(m.t==='toast'){toast(m.text);return}
  if(m.t==='show'){note(m.opts);return}
  if(m.t==='ask'){sheet(m.opts).then(v=>send(NET&&NET.hostConn,{t:'answer',id:m.id,v}));return}
}
function hostGone(){
  if(G&&G.over){leaveNet();return}
  leaveNet();G=null;clearSheets();renderSetup();
  sheet({title:'Гру завершено',body:'<p>Хост закрив кімнату або втратив з’єднання.</p>'});
}

/* ---------- 3D board (three.js + Kenney CC0 models) ---------- */
const B3={el:null,failed:false,ready:false,tpl:{},tiles:[],tileKey:[],toks:{},anim:new Map(),thumbs:{}};
const CELL_MODEL={0:'flag',1:'block-coin',3:'vehicle-truck-yellow',5:'building-small-a',7:'vehicle-motorcycle',9:'building-small-c',11:'decoration-tents',13:'building-garage',15:'vehicle-truck-red',17:'building-small-b',19:'building-small-a',21:'building-small-c',23:'vehicle-truck-purple',25:'vehicle-truck-green',27:'coin',28:'building-small-d',30:'building-small-d',31:'coin'};
const use3D=()=>SET.board3d!==false&&!B3.failed&&!!B3.el;
function tilePos(i){const [r,c]=gridPos(i),h=(SIDE+1)/2;return {x:(c-h)*1.0,z:(r-h)*1.0}}
function load3DLibs(){
  if(window.THREE&&window.A3D&&THREE.GLTFLoader){init3D();return}
  const srcs=['three.min.js','GLTFLoader.js','assets3d.js'];let k=0;
  const next=()=>{if(k>=srcs.length){init3D();return}const sc=document.createElement('script');sc.src=srcs[k++];sc.onload=next;sc.onerror=()=>{B3.failed=true};document.head.appendChild(sc)};
  next();
}
function init3D(){
  if(B3.el||B3.failed||!window.THREE||!window.A3D)return;
  try{
    const T=THREE;
    const el=document.createElement('div');el.className='b3';
    const r=new T.WebGLRenderer({antialias:true});
    r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    r.outputEncoding=T.sRGBEncoding;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;
    el.appendChild(r.domElement);
    const scene=new T.Scene();scene.background=new T.Color(0x141a2e);scene.fog=new T.Fog(0x141a2e,19,38);
    const cam=new T.PerspectiveCamera(34,1,.1,100);
    scene.add(new T.HemisphereLight(0xe6edff,0x323a58,.85));
    const sun=new T.DirectionalLight(0xfff0d8,.95);sun.position.set(-4,10,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
    Object.assign(sun.shadow.camera,{left:-6.8,right:6.8,top:6.8,bottom:-6.8,near:1,far:34});sun.shadow.bias=-.0006;scene.add(sun);
    const table=new T.Mesh(new T.BoxGeometry(SIDE+1.3,.4,SIDE+1.3),new T.MeshStandardMaterial({color:0x26304e,roughness:.85}));table.position.y=-.25;table.receiveShadow=true;scene.add(table);
    const rim=new T.Mesh(new T.BoxGeometry(SIDE+1.5,.3,SIDE+1.5),new T.MeshStandardMaterial({color:0xf2c14e,roughness:.5,metalness:.3}));rim.position.y=-.4;scene.add(rim);
    const park=new T.Mesh(new T.BoxGeometry(SIDE-2.14,.1,SIDE-2.14),new T.MeshStandardMaterial({color:0x6fbf6a,roughness:1}));park.position.y=-.01;park.receiveShadow=true;scene.add(park);
    const maxAniso=r.capabilities.getMaxAnisotropy();
    CELLS.forEach((c,i)=>{
      const cv=document.createElement('canvas');cv.width=cv.height=256;
      const tex=new T.CanvasTexture(cv);tex.anisotropy=maxAniso;tex.encoding=T.sRGBEncoding;
      const side=new T.MeshStandardMaterial({color:0xb9c2d6,roughness:.8});
      const top=new T.MeshStandardMaterial({map:tex,roughness:.7});
      const m=new T.Mesh(new T.BoxGeometry(.95,.16,.95),[side,side,top,side,side,side]);
      const {x,z}=tilePos(i);m.position.set(x,0,z);m.receiveShadow=true;m.userData.cell=i;scene.add(m);
      B3.tiles[i]={mesh:m,cv,tex};
    });
    const ring=new T.Mesh(new T.TorusGeometry(.5,.035,10,48),new T.MeshBasicMaterial({color:0xf2c14e,transparent:true,opacity:.9}));ring.rotation.x=-Math.PI/2;ring.position.y=.1;scene.add(ring);
    Object.assign(B3,{el,r,scene,cam,ring,T});
    // tap a tile -> its info
    let down=null;
    r.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
    r.domElement.addEventListener('pointerup',e=>{
      if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>8||!G)return;down=null;
      const rc=r.domElement.getBoundingClientRect();
      const v=new T.Vector2((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);
      const ray=new T.Raycaster();ray.setFromCamera(v,cam);
      const hit=ray.intersectObjects(B3.tiles.map(t=>t.mesh))[0];
      if(hit)cellInfo(hit.object.userData.cell);
    });
    new ResizeObserver(()=>fit3D()).observe(el);
    loadModels();
    requestAnimationFrame(loop3D);
    if(G)renderGame();
  }catch(e){console.warn('3D off',e);B3.failed=true;B3.el=null}
}
function fit3D(){
  if(!B3.el)return;const w=B3.el.clientWidth,h=B3.el.clientHeight;if(!w||!h)return;

function sync3D(){

function pcard(q,i){

  if(q.ef.ins)ef.push(`<span class="chip good">страховка ×${q.ef.ins}</span>`);
  if(q.owned.length)ef.push(`<span class="chip">майно: ${q.owned.filter(o=>o.cell>=0).length}</span>`);
  return `<button class="pcard ${i===G.cur&&!G.over?'cur':''} ${q.out?'out':''}" data-p="${i}">
    <div class="pname"><span class="dot" style="--c:${q.color}"></span><span>${q.av?`<span class="pav">${q.av}</span>`:''}${esc(q.name)}${q.bot?' · бот':''}</span></div>

/* ---------- sheets ---------- */
let toastT;
function toast(t){clearTimeout(toastT);let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=t;toastT=setTimeout(()=>el.remove(),1800)}
/* Sheet queue: every window waits its turn, oldest first.
   note() = event window for the player to read; the game does not wait for it.
   sheet() = window whose answer the code needs; it waits in the same line.
   now:true = the player tapped something themselves, so it jumps to the front. */
const SQ=[];let curSheet=null;
function closeSheet(){if(curSheet)curSheet.close(curSheet.def)}
function clearSheets(){while(SQ.length){const it=SQ.shift();it.res(null)}closeSheet()}
function sheet(opts){return new Promise(res=>{const it={opts,res};opts.now?SQ.unshift(it):SQ.push(it);pumpSheets();if(curSheet&&curSheet.refresh)curSheet.refresh()})}
function note(opts){
  const o={...opts,auto:null,note:true,buttons:[{l:'OK',v:1,pri:1}]};
  SQ.push({opts:o,res:()=>{}});pumpSheets();if(curSheet&&curSheet.refresh)curSheet.refresh();
}
function pumpSheets(){
  if(curSheet||!SQ.length)return;
  const it=SQ.shift();const {title,who,body,buttons=[{l:'Добре',v:1,pri:1}],note:isNote}=it.opts;
  const el=document.createElement('div');el.className='veil';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(String(title).replace(/<[^>]*>/g,''))}">
    <div class="who">${who?`<span class="dot" style="--c:${who.color}"></span>${esc(who.name)}`:''}<span class="qslot" style="margin-left:auto"></span></div>
    <h3>${title}</h3><div class="body">${body||''}</div>
    <div class="acts">${buttons.map((b,i)=>`<button class="btn ${b.pri?'pri':''}" data-k="${i}" ${b.dis?'disabled':''}>${b.l}</button>`).join('')}
    <span class="skipslot" style="display:contents"></span></div>
  </div>`;
  $('#sheetHost').appendChild(el);
  let closed=false,timer=null;
  const me={def:null,close(v){if(closed)return;closed=true;clearTimeout(timer);el.remove();if(curSheet===me)curSheet=null;it.res(v);pumpSheets()}};
  curSheet=me;
  if(isNote&&!SET.waitOk)timer=setTimeout(()=>me.close(1),1800);
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>me.close(buttons[+b.dataset.k].v));
  /* live counter: events keep arriving while this window is open */
  me.refresh=()=>{
    const n=SQ.filter(x=>x.opts.note).length;
    const q=el.querySelector('.qslot');if(q)q.innerHTML=n?`<span class="qcount">ще ${n} ${n===1?'подія':n<5?'події':'подій'}</span>`:'';
    const sl=el.querySelector('.skipslot');
    if(sl){sl.innerHTML=isNote&&n>0?`<button class="btn" data-skip="1">Пропустити всі події (${n+1})</button>`:'';
      const sk=sl.querySelector('[data-skip]');if(sk)sk.onclick=()=>{for(let i=SQ.length-1;i>=0;i--)if(SQ[i].opts.note)SQ.splice(i,1);me.close(1)}}
  };
  me.refresh();
  const first=el.querySelector('.btn:not(:disabled)');if(first)first.focus({preventScroll:true});
}
/* One entry point for every on-turn sheet: bots answer themselves, this device's
   players tap a button, remote players answer on their own phone; everyone else watches. */
let askSeq=0;const pending=new Map();
async function ask(p,opts,botChoice=1){
  opts={buttons:[{l:'Добре',v:1,pri:1}],...opts,who:{name:p.name,color:p.color}};
  const pub=opts.pub!=null?opts.pub:opts.body;delete opts.pub;
  const multi=opts.buttons.length>1;
  const pubBtns=opts.pubBtns;delete opts.pubBtns;
  if(p.bot){
    const b=opts.buttons.find(x=>x.v===botChoice);
    const seeAll=viewerIdx()<0&&!NET;
    const view={...opts,body:(seeAll?opts.body:pub)+(multi&&b&&!pubBtns?`<p class="pick">Бот обирає: ${b.l}</p>`:'')};
    netShow(view);note(view);await sleep(multi?1100:800);return botChoice;
  }
  const spect={...opts,body:pub||''};
  if(isMine(p)){if(!multi)netShow(spect);return sheet(opts)}
  if(!multi){netShow(spect,p.ctrl);note(spect)}
  const conn=NET&&NET.conns.get(p.ctrl);
  if(!conn||!conn.open)return botChoice;
  const id=++askSeq;
  const allowed=opts.buttons.filter(b=>!b.dis).map(b=>b.v);
  return new Promise(res=>{pending.set(id,{res,botChoice,ctrl:p.ctrl,allowed});send(conn,{t:'ask',id,opts})});
}

  if(!G||!G.over)return;

  const rank=[...G.players].sort((a,b)=>(a.out-b.out)||score(b)-score(a));
  h.unshift({id:G.id,date:Date.now(),mode:G.mode||'classic',online:!!G.online,rounds:G.round,

/* ---------- on someone else's property: prank or good deed ---------- */
const VISIT={
  home:{dmg:'💧 Затопити квартиру',dmgLog:'затопив квартиру',rob:'🔓 Обнести, поки нікого нема',good:'🎁 Подарувати на новосілля'},
  car:{dmg:'🔨 Подряпати машину',dmgLog:'подряпав машину',rob:'🛞 Зняти колеса і продати',good:'🧽 Помити машину'},
  biz:{dmg:'⭐ Залишити поганий відгук',dmgLog:'залишив поганий відгук на',rob:'💸 Пограбувати касу',good:'📣 Порекомендувати друзям'}
};
async function visitAction(p,o,c){
  const V=VISIT[c.g];
  const dmgCost=Math.round(c.price*.12/50)*50, fineDmg=Math.round(c.price*.1/50)*50+500;
  const botPick=(()=>{const r=Math.random();if(r<.45)return 0;if(r<.6)return 'good';if(r<.75)return 'dmg';if(r<.88)return 'rob';return 'tax'})();
  const body=`<p>Ти на майні <b style="color:${o.color}">${esc(o.name)}</b>. Можна зіпсувати йому життя — або зробити добру справу.</p>
    ${SET.hints?`<p class="tip">Пакості ризиковані: можуть спіймати і оштрафувати. Добра справа піднімає щастя обом.</p>`:''}`;
  const v=await ask(p,{title:`${c.ic} Що робимо?`,body,
    buttons:[{l:V.dmg+' · ризик 25%',v:'dmg'},{l:V.rob+' · ризик 35%',v:'rob'},{l:'🧾 Поскаржитись у податкову',v:'tax'},{l:V.good,v:'good'},{l:'Пройти мимо',v:0,pri:1}]},botPick);
  if(!v)return;
  const alarm=(v!=='good'&&o.ef.alarm>0);
  if(alarm)o.ef.alarm--;
  const caught=chance=>alarm||Math.random()<chance+(hasPerk(o,8)?.25:0);
  let res='',pub='',ownerMsg='';
  if(v==='dmg'){
    if(caught(.25)){p.money-=fineDmg;joy(p,-5);res=`Тебе спіймали${alarm?' — спрацювала сигналізація':''}! Штраф ${fmt(fineDmg)}, −5 щастя.`;pub=`${nm(p)} хотів напакостити ${nm(o)}, але його спіймали${alarm?' (сигналізація)':''}.`;ownerMsg=`${p.name} хотів зіпсувати «${c.name}», але його спіймали`}
    else{o.money-=dmgCost;joy(o,-8);res=`Вийшло. ${esc(o.name)} платить за ремонт ${fmt(dmgCost)} і втрачає 8 щастя.`;pub=`${nm(p)} ${V.dmgLog} «${esc(c.name)}» гравця ${nm(o)}!`;ownerMsg=`${p.name} ${V.dmgLog} «${c.name}»: −${fmt(dmgCost)}`}
  }
  if(v==='rob'){
    if(caught(.35)){p.money-=2000;p.ef.skip+=1;joy(p,-5);res=`Спіймали${alarm?' — спрацювала сигналізація':''}! Штраф 2000 ₴ і пропуск ходу.`;pub=`${nm(p)} намагався пограбувати ${nm(o)}, але попався${alarm?' (сигналізація)':''}.`;ownerMsg=`${p.name} намагався тебе пограбувати — спіймали`}
    else{const take=Math.min(2500,Math.max(0,Math.round(o.money*.15/50)*50));o.money-=take;p.money+=take;joy(o,-10);
      res=take?`Здобич: ${fmt(take)}. Ніхто не бачив.`:'Взяти нічого — у власника порожньо.';pub=take?`${nm(p)} пограбував ${nm(o)}!`:`${nm(p)} поліз до ${nm(o)}, але нічого не знайшов.`;ownerMsg=take?`${p.name} пограбував тебе: −${fmt(take)}`:''}
  }
  if(v==='tax'){
    if(Math.random()<.25&&!alarm){p.money-=1000;res='Перевірка нічого не знайшла. Тебе оштрафували за наклеп: −1000 ₴.';pub=`${nm(p)} поскаржився на ${nm(o)} у податкову — і отримав штраф за наклеп.`}
    else{const t=Math.max(500,Math.round(Math.max(o.money,0)*.1/50)*50);o.money-=t;joy(o,-5);res=`Податкова прийшла до ${esc(o.name)} і виписала штраф.`;pub=`${nm(p)} наслав податкову на ${nm(o)}.`;ownerMsg=`${p.name} поскаржився в податкову: −${fmt(t)}`}
  }
  if(v==='good'){
    joy(p,8);joy(o,10);
    if(c.g==='home'){const g=Math.min(500,Math.max(0,p.money));p.money-=g;o.money+=g;res=`Подарунок вручено (${fmt(g)}). +8 щастя тобі, +10 власнику.`}
    else if(c.g==='biz'){o.money+=1000;res='Друзі прийшли — у власника +1000 ₴ виручки. +8 щастя тобі, +10 власнику.'}
    else{res='Машина сяє. +8 щастя тобі, +10 власнику.'}

  }
  log(pub);if(ownerMsg)sayTo(o,ownerMsg);renderGame();
  await ask(p,{title:v==='good'?'💛 Добра справа':'😈 Результат',body:`<p>${res}</p>`,pub:`<p>${pub}</p>`});
}
function hideAsset(p,k){

/* ---------- turn flow (runs on the host / this phone only) ---------- */
async function startTurn(){
  if(!G||G.over||isClient())return;
  const p=P();renderGame();save();
  if(p.ef.skip>0){
    p.ef.skip--;log(`${nm(p)} пропускає хід (хворіє).`);say(`${p.name} пропускає хід`);
    busy=true;renderGame();await sleep(1100);busy=false;return endTurn();
  }
  if(p.bot){await sleep(800);if(G&&P()===p&&!busy)doTurn()}
}
async function doTurn(){
  const p=P();busy=true;rolling=true;renderGame();
  await sleep(650);
  const d=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];
  lastDice=d;rolling=false;renderGame();
  const steps=d[0]+d[1];log(`${nm(p)} кидає ${d[0]}+${d[1]}.`);
  for(let s=0;s<steps;s++){
    p.pos=(p.pos+1)%CELLS.length;
    if(p.pos===0)payday(p);
    renderGame();await sleep(140);
  }
  await land(p);
  await afterAction(p);
  if(!G)return;
  if(p.out||G.over){busy=false;return endTurn()}
  if(p.ef.extra){p.ef.extra=0;log(`${nm(p)} ходить ще раз.`);busy=false;renderGame();if(p.bot){await sleep(700);return doTurn()}return}
  busy=false;endTurn();
}
function payday(p){
  p.laps++;
  let sal=p.job.s*(RU().salaryMul||1);const notes=[];
  if(p.ef.burn>0){sal*=.5;p.ef.burn--;notes.push('вигорання')}
  if(p.hp<30){sal*=.6;notes.push('лікарняні')}
  sal=Math.round(sal);p.money+=sal;
  let paid=0;if(p.ef.holiday){p.ef.holiday=0;notes.push('кредитні канікули')}else p.owned.forEach(o=>{if(o.left>0){const x=Math.min(o.pay,o.left);o.left-=x;paid+=x;if(o.left===0){joy(p,5)}}});
  p.money-=paid;
  if(hasPerk(p,7)){const n=p.owned.filter(o=>o.cell>=0).length;if(n){p.money+=150*n;notes.push('дивіденди +'+fmt(150*n))}}
  let living=0;if(RU().living){living=250*G.round;p.money-=living;if(G.round>12)hurt(p,Math.min(8,G.round-12))}
  joy(p,-3); if(p.happy===0)hurt(p,10);
  plog(p,`${nm(p)}: зарплата +${fmt(sal)}${notes.length?' ('+notes.join(', ')+')':''}${paid?`, кредити −${fmt(paid)}`:''}${living?`, життя −${fmt(living)}`:''}.`,`${nm(p)} отримує зарплату${paid?' і платить кредити':''}.`);
  sayTo(p,`Зарплата +${fmt(sal)}${paid?' · кредити −'+fmt(paid):''}${living?' · життя −'+fmt(living):''}`);
}

function reviveReturns(){

function endTurn(){

  G.cur=i;

function checkEnd(){

  else if(ru.out!=='restart'&&!returning&&al.length<=1){winner=al[0]||null;why='Залишився останнім у грі.'}
  else if(ru.rounds&&G.round>ru.rounds){winner=[...(al.length?al:G.players)].sort((a,b)=>score(b)-score(a))[0];why=`Найкращий рахунок після ${ru.rounds} кіл.`}
  if(!winner&&(al.length!==0||returning||ru.out==='restart'))return false;
  G.over=true;G.winner=winner?G.players.indexOf(winner):null;busy=false;save();archiveGame();
  const rank=[...G.players].sort((a,b)=>(a.out-b.out)||score(b)-score(a));
  log(winner?`${nm(winner)} перемагає! ${why}`:'Усі вибули.');
  renderGame();
  const view={title:winner?`Перемога: ${esc(winner.name)}`:'Ніхто не вижив',body:`<p>${why}</p><div class="kv" style="margin-top:8px">${rank.map(q=>`<span><span class="dot" style="--c:${q.color};display:inline-block;margin-right:6px"></span>${esc(q.name)}${q.out?' · вибув':''}</span><span>${q.out?'—':score(q).toLocaleString('uk-UA')+' оч.'}</span>`).join('')}</div><p style="color:var(--muted);font-size:13px;margin-top:8px">Очки = капітал + щастя×100 + здоров’я×50.</p>`};
  netShow({...view,buttons:[{l:'Подивитись поле',v:0}]});
  const xr=isClient()?null:awardXP();
  sheet({...view,body:view.body+xpLine(xr),buttons:[{l:NET?'У меню':'Нова гра',v:1,pri:1},{l:'📜 Лог гри',v:'log'},{l:'Подивитись поле',v:0}]})
    .then(v=>{if(v==='log')showGameLog();else if(v){clearSave();backToMenu()}});
  return true;
}

if(SET.orient!=='auto'||hasBridge())applyOrient();
renderSetup();
if(SET.board3d!==false)load3DLibs();
document.title=T('Життя в кредит');
</script>
